name: deploy

# Deploys to cPanel over SSH after tests pass on main.
# Repository secrets (Settings → Secrets and variables → Actions). Either naming works:
#   SSH_HOST        or CPANEL_SSH_HOST   server host name
#   SSH_USER        or CPANEL_SSH_USER   cPanel username
#   SSH_PRIVATE_KEY or CPANEL_SSH_KEY    private key whose public key is authorized in cPanel → SSH Access
# Optional:
#   SSH_PORT        or CPANEL_SSH_PORT   SSH port (default 22)
#   SSH_KNOWN_HOSTS                      the server's host key line(s); without it the key is fetched with ssh-keyscan
#   CPANEL_APP_PATH                      app folder on the server (default: "zirak" in the cPanel home folder)
#   CPANEL_PHP                           PHP 8.3+ CLI (default "php"), e.g. /opt/cpanel/ea-php83/root/usr/bin/php
#   SITE_URL (variable or secret)        checked after deploying (default https://zirak.af)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      D_HOST: ${{ secrets.CPANEL_SSH_HOST || secrets.SSH_HOST }}
      D_USER: ${{ secrets.CPANEL_SSH_USER || secrets.SSH_USER }}
      D_KEY: ${{ secrets.CPANEL_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      D_PORT: ${{ secrets.CPANEL_SSH_PORT || secrets.SSH_PORT || '22' }}
      D_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      D_PATH: ${{ secrets.CPANEL_APP_PATH || 'zirak' }}
      D_PHP: ${{ secrets.CPANEL_PHP || 'php' }}
      D_SITE: ${{ vars.SITE_URL || secrets.SITE_URL || 'https://zirak.af' }}
    steps:
      - name: Check the deploy settings
        id: check
        run: |
          # Only "set" or "missing" is printed, never a value.
          s() { [ -n "$1" ] && echo set || echo missing; }
          echo "SSH host:        $(s "$D_HOST")"
          echo "SSH user:        $(s "$D_USER")"
          echo "SSH private key: $(s "$D_KEY")"
          echo "SSH port:        $( [ "$D_PORT" = 22 ] && echo '22 (default)' || echo set)"
          echo "Known hosts:     $(s "$D_KNOWN_HOSTS")"
          echo "App folder:      $D_PATH"
          if [ -n "$D_HOST" ] && [ -n "$D_USER" ] && [ -n "$D_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not deployed: set SSH_HOST, SSH_USER and SSH_PRIVATE_KEY (or the CPANEL_* names). See docs/DEPLOY-CPANEL.md."
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: shivammathur/setup-php@v2
        if: steps.check.outputs.ready == 'true'
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite, gd, zip

      - name: Run tests
        if: steps.check.outputs.ready == 'true'
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env && php artisan key:generate
          php artisan test

      - name: Build the production bundle
        if: steps.check.outputs.ready == 'true'
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress
          php artisan filament:assets
          rm -f .env bootstrap/cache/*.php

      - name: Set up SSH
        if: steps.check.outputs.ready == 'true'
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$D_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          if [ -n "$D_KNOWN_HOSTS" ]; then
            printf '%s\n' "$D_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$D_PORT" -H "$D_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts
          echo "SSH_CMD=ssh -i $HOME/.ssh/deploy_key -p $D_PORT -o BatchMode=yes -o ConnectTimeout=20" >> "$GITHUB_ENV"

      - name: Check the server
        if: steps.check.outputs.ready == 'true'
        run: |
          $SSH_CMD "$D_USER@$D_HOST" bash -s <<EOF
          set -e
          echo "Connected as \$(whoami) on \$(hostname)."
          VERSION=\$($D_PHP -r 'echo PHP_VERSION;' 2>/dev/null || echo none)
          echo "PHP: \$VERSION ($D_PHP)"
          $D_PHP -r 'exit(version_compare(PHP_VERSION, "8.3.0", ">=") ? 0 : 1);' || { echo "::error::PHP 8.3 or newer is needed. In cPanel → MultiPHP choose 8.3, or set the CPANEL_PHP secret, e.g. /opt/cpanel/ea-php83/root/usr/bin/php"; exit 1; }
          command -v tar >/dev/null || { echo "::error::tar is not available on the server."; exit 1; }
          mkdir -p "$D_PATH"
          test -f "$D_PATH/.env" || { echo "::error::$D_PATH/.env is missing on the server. Create it once (docs/DEPLOY-CPANEL.md, step 5): database name, user and password, APP_URL=https://zirak.af, APP_ENV=production, APP_DEBUG=false."; exit 1; }
          echo "Found $D_PATH/.env"
          EOF

      - name: Upload files
        if: steps.check.outputs.ready == 'true'
        run: |
          # The server has no rsync: send one compressed archive and unpack it next to the app.
          tar czf /tmp/release.tgz \
            --exclude='./.git' --exclude='./.github' --exclude='./node_modules' --exclude='./tests' \
            --exclude='./.env' --exclude='./storage' --exclude='./public/storage' \
            --exclude='./bootstrap/cache/*.php' --exclude='./database/*.sqlite' .
          echo "Archive: $(du -h /tmp/release.tgz | cut -f1)"
          $SSH_CMD "$D_USER@$D_HOST" "cd '$D_PATH' && rm -rf .incoming && mkdir .incoming && tar xzf - -C .incoming" < /tmp/release.tgz

      - name: Migrate and refresh caches
        if: steps.check.outputs.ready == 'true'
        run: |
          $SSH_CMD "$D_USER@$D_HOST" bash -s <<EOF
          set -e
          cd "$D_PATH"
          if [ -f artisan ]; then $D_PHP artisan down --retry=15 || true; fi
          # Swap in the new release item by item. .env, storage/ and public/storage are never in the archive, so they stay.
          for item in \$(ls -A .incoming); do
            rm -rf "./\$item"
            mv ".incoming/\$item" "./\$item"
          done
          rmdir .incoming
          mkdir -p storage/app/public storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
          # First deploy: create the encryption key once (never change it afterwards: saved settings depend on it).
          grep -qE '^APP_KEY=.+' .env || $D_PHP artisan key:generate --force
          $D_PHP artisan down --retry=15 || true
          $D_PHP artisan migrate --force
          [ -L public/storage ] || $D_PHP artisan storage:link
          $D_PHP artisan optimize:clear
          $D_PHP artisan optimize
          $D_PHP artisan up
          echo "Deployed \$(date -u +%FT%TZ) at \$(pwd)"
          echo "Web root for the domain must be: \$(pwd)/public"
          EOF

      - name: Bring the site back up if something failed
        if: failure() && steps.check.outputs.ready == 'true'
        run: $SSH_CMD "$D_USER@$D_HOST" "cd '$D_PATH' && test -f artisan && $D_PHP artisan up" || true

      - name: Check the live site
        if: steps.check.outputs.ready == 'true'
        run: |
          CODE=$(curl -s -o /tmp/home.html -w '%{http_code}' -L --max-time 30 "$D_SITE" || echo 000)
          echo "$D_SITE answered HTTP $CODE"
          if grep -qi 'manifest.webmanifest' /tmp/home.html; then
            echo "The Zirak app is answering."
          else
            echo "::warning::$D_SITE does not show the Zirak app yet (HTTP $CODE). Point the domain's document root to the app's public folder (printed above)."
            head -c 400 /tmp/home.html || true
          fi
